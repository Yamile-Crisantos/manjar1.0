<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">
    <body>
        <ui:composition template="/plantillas/plantilla.xhtml">

            <ui:define name="titulo">Inicio · Manjar</ui:define>

            <ui:define name="ruta">
                <ui:include src="/plantillas/migas.xhtml">
                    <ui:param name="actual" value="Inicio"/>
                </ui:include>
            </ui:define>

            <ui:define name="contenido">
                <section class="mj-banner">
                    <div>
                        <p class="mj-eyebrow">Sistema de gestión</p>
                        <h1>Fondas y restaurantes</h1>
                        <p class="mj-lead">Consulta el menú del día de cada negocio y qué platillos siguen disponibles.</p>
                        <h:panelGroup layout="block" styleClass="mj-nota" rendered="#{not sesion.autenticado}">
                            ¿Eres dueño, gerente o mesero de un negocio?
                            <h:link value="Inicia sesión" outcome="/vistas/acceso"/> con la cuenta que te dieron.
                        </h:panelGroup>
                    </div>
                </section>

                <h2 class="mj-titulo-seccion">Negocios</h2>
                <ui:include src="/plantillas/negocios.xhtml"/>
            </ui:define>

        </ui:composition>
    </body>
</html>
