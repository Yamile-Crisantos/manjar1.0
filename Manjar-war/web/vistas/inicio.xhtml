<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">
    <body>
        <ui:composition template="/plantillas/plantilla.xhtml">

            <ui:define name="titulo">Inicio · Manjar</ui:define>

            <!-- Sin "ruta": se usa la de la plantilla (solo Inicio) -->

            <ui:define name="contenido">
                <div class="manjar-hero">
                    <h1>Bienvenido a Manjar</h1>
                    <p>Administra tu fonda o restaurante en un solo lugar: menú, comandas, caja y reportes.</p>
                </div>

                <div class="manjar-grid">
                    <div class="manjar-card">
                        <h3>Menú</h3>
                        <p>Platillos y su disponibilidad del día.</p>
                        <h:link value="Abrir módulo" outcome="/vistas/menu" styleClass="manjar-btn"/>
                    </div>
                    <div class="manjar-card">
                        <h3>Comandas</h3>
                        <p>El mesero registra pedidos y la cocina los recibe.</p>
                        <h:link value="Abrir módulo" outcome="/vistas/comandas" styleClass="manjar-btn"/>
                    </div>
                    <div class="manjar-card">
                        <h3>Caja</h3>
                        <p>Cobro de cuentas y control de efectivo.</p>
                        <h:link value="Abrir módulo" outcome="/vistas/caja" styleClass="manjar-btn"/>
                    </div>
                </div>
            </ui:define>

        </ui:composition>
    </body>
</html>
