<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:p="http://primefaces.org/ui">
    <body>
        <ui:composition template="/plantillas/plantilla.xhtml">

            <ui:define name="metadata">
                <f:metadata>
                    <f:viewParam name="destino" value="#{registroBean.destino}"/>
                </f:metadata>
            </ui:define>

            <ui:define name="titulo">Crear cuenta · Manjar</ui:define>

            <ui:define name="ruta">
                <ui:include src="/plantillas/migas.xhtml">
                    <ui:param name="actual" value="Crear cuenta"/>
                </ui:include>
            </ui:define>

            <ui:define name="contenido">
                <div class="mj-auth">

                    <div class="mj-auth-form">
                        <h1>Crear cuenta</h1>

                        <h:form id="formRegistro" styleClass="manjar-form">
                            <div class="manjar-field">
                                <p:outputLabel for="nombre" value="Nombre"/>
                                <p:inputText id="nombre" value="#{registroBean.nombre}" maxlength="255"
                                             required="true" requiredMessage="Escribe tu nombre."/>
                            </div>
                            <div class="manjar-field">
                                <p:outputLabel for="correo" value="Correo"/>
                                <p:inputText id="correo" value="#{registroBean.correo}" maxlength="255"
                                             required="true" requiredMessage="Escribe tu correo."
                                             placeholder="tu@correo.com"/>
                            </div>
                            <div class="manjar-row">
                                <div class="manjar-field">
                                    <p:outputLabel for="clave" value="Contraseña (mín. 8 caracteres)"/>
                                    <p:password id="clave" value="#{registroBean.clave}" maxlength="100"
                                                required="true" requiredMessage="Escribe una contraseña."/>
                                </div>
                                <div class="manjar-field">
                                    <p:outputLabel for="confirmacion" value="Repite la contraseña"/>
                                    <p:password id="confirmacion" value="#{registroBean.confirmacion}" maxlength="100"
                                                required="true" requiredMessage="Repite la contraseña."/>
                                </div>
                            </div>
                            <div class="manjar-form-actions">
                                <p:commandButton value="Crear cuenta" action="#{registroBean.registrar}" ajax="false"/>
                            </div>
                        </h:form>

                        <p class="mj-pie-form">¿Ya tienes cuenta?
                            <h:link value="Iniciar sesión" outcome="/vistas/acceso">
                                <f:param name="destino" value="#{registroBean.destino}" disable="#{empty registroBean.destino}"/>
                            </h:link>
                        </p>
                    </div>
                </div>
            </ui:define>

        </ui:composition>
    </body>
</html>
