<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">
    <body>
        <ui:composition template="/plantillas/plantilla.xhtml">

            <ui:define name="metadata">
                <f:metadata>
                    <f:viewParam name="q" value="#{menuPublicoBean.codigo}"/>
                    <f:viewAction action="#{menuPublicoBean.recordar}"/>
                </f:metadata>
            </ui:define>

            <!-- Con la marca del negocio donde se va a apartar -->
            <ui:param name="comensal" value="#{menuPublicoBean.marca != null}"/>

            <ui:define name="titulo">#{menuPublicoBean.marca != null ? menuPublicoBean.marca.nombre : 'Manjar'} · Apartar</ui:define>

            <ui:define name="ruta">
                <ui:include src="/plantillas/migas.xhtml">
                    <ui:param name="actual" value="Apartar"/>
                </ui:include>
            </ui:define>

            <ui:define name="contenido">
                <h1>Apartar platillos</h1>
                <p class="mj-lead">Hola, <h:outputText value="#{sesion.nombre}"/>. Aquí podrás elegir tus platillos, pagar el anticipo y recibir tu comprobante.</p>
                <h:panelGroup layout="block" styleClass="mj-nota" rendered="#{menuPublicoBean.establecimiento != null}">
                    Negocio: <strong><h:outputText value="#{menuPublicoBean.establecimiento.nombre}"/></strong>
                </h:panelGroup>
                <div class="mj-pronto">
                    <strong>Módulo en construcción</strong>
                    <span>Muy pronto podrás apartar desde aquí.</span>
                    <h:link value="Volver al menú" outcome="/vistas/menu" styleClass="manjar-btn manjar-btn-sec"
                            rendered="#{not empty menuPublicoBean.codigoVigente}">
                        <f:param name="q" value="#{menuPublicoBean.codigoVigente}"/>
                    </h:link>
                    <h:link value="Volver a mi panel" outcome="/vistas/panel" styleClass="manjar-btn manjar-btn-sec"
                            rendered="#{empty menuPublicoBean.codigoVigente}"/>
                </div>
            </ui:define>

        </ui:composition>
    </body>
</html>
