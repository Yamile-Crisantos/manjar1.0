<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"

      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">
    <body>
        <ui:composition template="/plantillas/plantilla.xhtml">

            <ui:define name="titulo">Apartar · Manjar</ui:define>

            <ui:define name="ruta">
                <ui:include src="/plantillas/migas.xhtml">
                    <ui:param name="actual" value="Apartar"/>
                </ui:include>
            </ui:define>

            <ui:define name="contenido">
                <h1>Apartar platillos</h1>
                <p class="mj-lead">Hola, #{sesion.nombre}. Aquí podrás elegir tus platillos, pagar el anticipo y recibir tu comprobante.</p>
                <div class="mj-pronto">
                    <strong>Módulo en construcción</strong>
                    <span>Muy pronto podrás apartar desde aquí.</span>
                    <h:link value="Volver al menú" outcome="/vistas/menu" styleClass="manjar-btn manjar-btn-sec"/>
                </div>
            </ui:define>

        </ui:composition>
