<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:p="http://primefaces.org/ui">
    <body>
        <ui:composition template="/plantillas/plantilla.xhtml">

            <ui:define name="titulo">Registra tu negocio · Manjar</ui:define>

            <ui:define name="ruta">
                <ui:include src="/plantillas/migas.xhtml">
                    <ui:param name="actual" value="Registra tu negocio"/>
                </ui:include>
            </ui:define>

            <ui:define name="contenido">
                <div class="mj-auth ancho">
                    <div class="mj-auth-form">
                        <h1>Registra tu negocio</h1>
                        <p class="manjar-muted">Crea tu cuenta de dueño y los datos de tu negocio. Al terminar entras
                            directo a tu panel para personalizar tu menú y agregar a tu personal.</p>

                        <h:form id="formNegocio" styleClass="manjar-form">

                            <fieldset class="mj-grupo">
                                <legend>Tu negocio</legend>
                                <div class="manjar-field">
                                    <p:outputLabel for="negocio" value="Nombre del negocio"/>
                                    <p:inputText id="negocio" value="#{registroNegocioBean.negocio}" maxlength="255"
                                                 required="true" requiredMessage="Escribe el nombre de tu negocio."
                                                 placeholder="Fonda Doña Lupe"/>
                                </div>
                                <div class="manjar-field">
                                    <p:outputLabel for="direccion" value="Dirección (opcional)"/>
                                    <p:inputText id="direccion" value="#{registroNegocioBean.direccion}" maxlength="255"
                                                 placeholder="Calle, número y colonia"/>
                                </div>
                            </fieldset>

                            <fieldset class="mj-grupo">
                                <legend>Tu cuenta de dueño</legend>
                                <div class="manjar-field">
                                    <p:outputLabel for="nombre" value="Tu nombre"/>
                                    <p:inputText id="nombre" value="#{registroNegocioBean.nombre}" maxlength="255"
                                                 required="true" requiredMessage="Escribe tu nombre."/>
                                </div>
                                <div class="manjar-field">
                                    <p:outputLabel for="correo" value="Correo"/>
                                    <p:inputText id="correo" value="#{registroNegocioBean.correo}" maxlength="255"
                                                 required="true" requiredMessage="Escribe tu correo."
                                                 placeholder="tu@correo.com"/>
                                </div>
                                <div class="manjar-row">
                                    <div class="manjar-field">
                                        <p:outputLabel for="clave" value="Contraseña (mín. 8 caracteres)"/>
                                        <p:password id="clave" value="#{registroNegocioBean.clave}" maxlength="100"
                                                    required="true" requiredMessage="Escribe una contraseña."/>
                                    </div>
                                    <div class="manjar-field">
                                        <p:outputLabel for="confirmacion" value="Repite la contraseña"/>
                                        <p:password id="confirmacion" value="#{registroNegocioBean.confirmacion}" maxlength="100"
                                                    required="true" requiredMessage="Repite la contraseña."/>
                                    </div>
                                </div>
                            </fieldset>

                            <div class="manjar-form-actions">
                                <p:commandButton value="Registrar mi negocio" action="#{registroNegocioBean.registrar}" ajax="false"/>
                            </div>
                        </h:form>

                        <p class="mj-pie-form">¿Ya tienes cuenta?
                            <h:link value="Iniciar sesión" outcome="/vistas/acceso"/>
                        </p>
                    </div>
                </div>
            </ui:define>

        </ui:composition>
    </body>
</html>
