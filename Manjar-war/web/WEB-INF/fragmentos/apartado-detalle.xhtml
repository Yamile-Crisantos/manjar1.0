<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">
    <body>
        <!-- Platillos y total de un apartado. Parámetro: ap = el apartado (ApartadoVista) -->
        <ui:composition>
            <ul class="mj-ticket-lineas">
                <ui:repeat var="l" value="#{ap.lineas}">
                    <li><b>#{l.cantidad} ×</b> <h:outputText value="#{l.nombre}"/></li>
                </ui:repeat>
            </ul>
            <footer class="mj-ticket-pie">
                <span class="manjar-muted">
                    <h:outputText value="#{ap.metodoPagoTexto}" rendered="#{not empty ap.metodoPago}"/>
                    <h:outputText value=" · ref. #{ap.referenciaPago}" rendered="#{not empty ap.referenciaPago}"/>
                    <h:outputText value="Recoge a las #{fmt.hora(ap.horaRecoleccion)}" rendered="#{empty ap.metodoPago}"/>
                </span>
                <strong>$<h:outputText value="#{ap.total}"><f:convertNumber minFractionDigits="2" maxFractionDigits="2"/></h:outputText></strong>
            </footer>
        </ui:composition>
    </body>
</html>
