<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:p="http://primefaces.org/ui">
    <body>
        <!-- Cómo llega el cliente a un negocio sin escanear otra vez su QR: sus negocios y el código del negocio.
             No es un directorio: solo salen los negocios donde esa persona ya apartó.
             Parámetro opcional: sufijo = texto que se agrega al id del formulario cuando la página lo incluye más de una vez. -->
        <ui:composition>
            <div class="mj-elegir-negocio">
                <h:panelGroup layout="block" rendered="#{not empty negocioCliente.mis}">
                    <h3 class="mj-op-sub">Mis negocios</h3>
                    <ul class="mj-negocios">
                        <ui:repeat var="n" value="#{negocioCliente.mis}">
                            <li>
                                <h:link outcome="/vistas/apartar" styleClass="mj-negocio-item">
                                    <f:param name="q" value="#{n.codigo}"/>
                                    <span class="mj-negocio-nombre"><h:outputText value="#{n.nombre}"/></span>
                                    <span class="manjar-muted">#{n.apartados} #{n.apartados == 1 ? 'apartado' : 'apartados'}</span>
                                    <span class="mj-negocio-ir">Apartar</span>
                                </h:link>
                            </li>
                        </ui:repeat>
                    </ul>
                </h:panelGroup>

                <h:form id="formNegocio#{sufijo}" styleClass="manjar-form">
                    <div class="manjar-field">
                        <p:outputLabel for="codigoNegocio" value="¿Tienes el código de un negocio?"/>
                        <p:inputText id="codigoNegocio" value="#{negocioCliente.codigo}" maxlength="300"
                                     placeholder="Por ejemplo: fonda-lupe-7k3m2q"/>
                        <span class="mj-ayuda">Lo ves en el enlace de su menú, después de “q=”, y también puedes pegar el enlace completo.
                            Cada negocio lo comparte con su código QR.</span>
                    </div>
                    <div class="manjar-form-actions">
                        <p:commandButton id="irNegocio" value="Ir al negocio" action="#{negocioCliente.irAlNegocio}" ajax="false"/>
                    </div>
                </h:form>
            </div>
        </ui:composition>
    </body>
</html>
