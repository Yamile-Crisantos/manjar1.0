<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">
    <body>
        <!-- Lista de movimientos. Parámetro: lista = List<MovimientoVista> -->
        <ui:composition>
            <h:panelGroup layout="block" styleClass="mj-vacio" rendered="#{empty lista}">
                Todavía no hay movimientos.
            </h:panelGroup>
            <h:panelGroup layout="block" rendered="#{not empty lista}">
                <table class="mj-tabla">
                    <thead>
                        <tr>
                            <th>Hora</th>
                            <th>Movimiento</th>
                            <th>Forma</th>
                            <th class="num">Monto</th>
                        </tr>
                    </thead>
                    <tbody>
                        <ui:repeat var="m" value="#{lista}">
                            <tr>
                                <td>#{fmt.hora(m.fechaHora)}</td>
                                <td>
                                    <strong>#{m.claseTexto}</strong>
                                    <span class="manjar-muted"><h:outputText value=" · #{m.concepto}"/></span>
                                    <span class="manjar-muted"><h:outputText value=" · #{m.usuarioNombre}" rendered="#{not empty m.usuarioNombre}"/></span>
                                </td>
                                <td>#{m.metodoTexto}</td>
                                <td class="num #{m.ingreso ? 'mov-ingreso' : 'mov-egreso'}">
                                    <h:outputText value="#{m.ingreso ? '+' : '−'}"/>$<h:outputText value="#{m.monto}"><f:convertNumber minFractionDigits="2" maxFractionDigits="2"/></h:outputText>
                                </td>
                            </tr>
                        </ui:repeat>
                    </tbody>
                </table>
            </h:panelGroup>
        </ui:composition>
    </body>
</html>
